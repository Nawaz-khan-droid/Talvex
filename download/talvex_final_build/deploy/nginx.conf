# ── TALVEX Nginx Reverse Proxy ──────────────────────────────
# Sits in front of Docker containers on port 80.
# Routes: / -> frontend (Next.js), /api/ -> backend (FastAPI)
#
# Security headers: Handled EXCLUSIVELY by FastAPI middleware.
# Nginx ONLY handles proxy routing and TLS termination.

upstream talvex_frontend {
    server talvex-frontend:3000;
}

upstream talvex_backend {
    server talvex-backend:8000;
}

server {
    listen 80;
    server_name _;

    # ── Gzip compression ─────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # ── Client body size limit (5 MB max for uploads) ───────
    client_max_body_size 5m;

    # ── Proxy API requests to FastAPI backend ───────────────
    location /api/ {
        proxy_pass http://talvex_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts for long-running LLM/scraping requests
        proxy_read_timeout 120s;
        proxy_send_timeout 30s;
        proxy_connect_timeout 10s;

        # Buffering off for streaming responses
        proxy_buffering off;
    }

    # ── Health check endpoints (direct to backend) ──────────
    location /health {
        proxy_pass http://talvex_backend;
        proxy_set_header Host $host;
    }

    # ── Everything else -> Next.js frontend ─────────────────
    location / {
        proxy_pass http://talvex_frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Next.js HMR WebSocket support (dev mode)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
