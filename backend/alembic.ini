# Alembic configuration for TALVEX
# Usage: alembic upgrade head

[alembic]
# Path to migration scripts
script_location = alembic

# Template used to generate migration files
file_template = %%(year)d%%(month).02d%%(day).02d_%%(hour).02d%%(minute).02d_%%(rev)s_%%(slug)s

# Set to 'true' to run the environment during the 'revision' command
# regardless of autogenerate
# revision_environment = false

# Set to 'true' to allow .pyc and .pyo files without a source .py file
# to be detected as revisions
# sourceless = false

# The version location specification — default is alembic/versions
# version_locations = %(here)s/bar:%(here)s/bat:alembic/versions

# The output encoding used when revision files are written from script.py.mako
# output_encoding = utf-8

# The database URL is read from the environment variable at runtime
# (see env.py). This placeholder is only used by `alembic.ini` parsing.
# Default placeholder — env.py overrides this at runtime from DATABASE_URL.
# Alembic requires a sync driver, so env.py auto-converts asyncpg → psycopg2.
sqlalchemy.url = postgresql+psycopg2://talvex:placeholder@talvex-db:5432/talvex

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
